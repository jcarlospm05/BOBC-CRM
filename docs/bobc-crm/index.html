<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173B61"><title>BOBC CRM Web</title><link rel="stylesheet" href="./css/theme.css"></head><body><div class="app"><header><div><strong class="brand">BOBC <em>CRM</em></strong><small id="status">Inicializando…</small></div><button id="new" class="add" aria-label="Nuevo cliente">+</button></header><main><section class="hero"><small>GESTIÓN COMERCIAL</small><h1>Mis relaciones</h1><p>Gestiona tus prospectos, clientes y empresas.</p><div class="actions"><button id="backup">Exportar JSON</button><button id="import">Restaurar JSON</button><input type="file" id="file" accept="application/json,.json" hidden></div></section><section id="relPanel"><div class="list-head"><h2>Contactos y clientes <span id="count">0</span></h2></div><input id="search" type="search" placeholder="Buscar nombre o empresa…" aria-label="Buscar"><div id="records"></div></section><section id="moduleRoot" hidden></section><section id="placeholder" hidden><h2 id="placeholderTitle">Módulo</h2><p>El modelo de datos está preparado. Esta pantalla se agregará en una siguiente fase.</p></section></main><nav aria-label="Navegación"><button data-tab="inicio">⌂<span>Inicio</span></button><button data-tab="relaciones" class="active">♧<span>Relaciones</span></button><button data-tab="comercial">◇<span>Negocios</span></button><button data-tab="reportes">▥<span>Reportes</span></button><button data-tab="mas">☰<span>Más</span></button></nav></div><dialog id="dialog"><form id="form"><h2>Nuevo registro</h2><label>Nombre o empresa<input id="personName" required maxlength="200"></label><label>Tipo<select id="personType"><option value="PERSON">Persona</option><option value="ORGANIZATION">Empresa</option></select></label><label>Estado<select id="personStage"><option value="LEAD">Prospecto</option><option value="CUSTOMER">Cliente</option></select></labe
