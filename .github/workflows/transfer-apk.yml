name: Transferir APK verificado

on:
  push:
    branches: [main]
    paths: ['.github/workflows/transfer-apk.yml']

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Leer APK publico y verificar contenido
        run: |
          python - <<'PY'
          import base64, hashlib, textwrap, urllib.request
          url = 'https://github.com/jcarlospm05/BOBC-CRM/releases/download/v0.4.1/BOBC-CRM-0.4.1-debug.apk'
          request = urllib.request.Request(url, headers={'User-Agent': 'BOBC-CRM-file-transfer'})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = response.read(200000)
          assert len(payload) == 45742, 'Unexpected APK size'
          assert hashlib.sha256(payload).hexdigest() == '7c6d7891266f7e922bae28768d3b6903760327be917d86fd8fbdb50d4a6ad30b', 'APK digest mismatch'
          print('BOBC_APK_BASE64_BEGIN')
          print('\n'.join(textwrap.wrap(base64.b64encode(payload).decode('ascii'), 120)))
          print('BOBC_APK_BASE64_END')
          PY
